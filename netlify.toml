# Configuración de Netlify para el sitio de Peniel Tours Flamingo.
#
# El sitio es HTML, CSS y JS planos: no hay compilación, así que no se define
# ningún "command". Al conectar el repositorio, Netlify lee este archivo solo.
#
# Se publica SOLO la carpeta profesional/. En la raíz del repositorio quedan los
# documentos de trabajo (PENDIENTES-CLIENTE, README, CLAUDE), las herramientas y
# los scripts: nada de eso debe quedar en internet.

[build]
  publish = "profesional"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Mientras sea propuesta, ningún buscador la indexa (las páginas ya traen
    # noindex; esto cubre también imágenes). QUITAR al publicar.
    X-Robots-Tag = "noindex, nofollow"

# Estilos y scripts no llevan hash en el nombre (styles.css, main.js): con
# must-revalidate el navegador pregunta siempre y Netlify responde 304 si no
# cambió. Así nunca se queda con la versión vieja después de un cambio.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
