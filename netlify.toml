# Configuración de Netlify para el sitio de Peniel Tours Flamingo.
# El sitio es HTML, CSS y JS planos: no hay compilación. Se publica solo la carpeta profesional/.
[build]
  publish = "profesional"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fotos y videos no cambian de nombre: se cachean un mes.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Estilos y scripts: preguntar siempre (Netlify responde 304 si no cambiaron).
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
