# Publica el sitio en GitHub Pages cada vez que cambia la rama principal del repositorio.
# Una sola vez: Settings > Pages > Build and deployment > Source: «GitHub Actions».
# Queda en https://<usuario>.github.io/penieltours/ (la raíz redirige a /profesional/).
name: Publicar en GitHub Pages
on:
  push:
    branches: [main, claude/sharp-hamilton-yjb8d6]   # la rama principal de este repositorio es la segunda
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r profesional _site/profesional
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
